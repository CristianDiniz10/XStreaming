# Builds the "XStreaming Live" APK in the cloud (GitHub Actions).
# Open the "Actions" tab > "Build Live APK" > latest run > download "xstreaming-live-apk".
name: Build Live APK

on:
  workflow_dispatch:
  push:
    branches: [live-youtube]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable Yarn (corepack)
        run: corepack enable

      - name: Install JS dependencies
        # The upstream lockfile is a bit out of date, so let Yarn refresh it here.
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already ships the Android SDK (ANDROID_HOME); only add the NDK.
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --install "ndk;23.1.7779620" > /dev/null

      - name: Install Rust Android targets (for the "nano" engine)
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleLiveRelease --no-daemon --stacktrace \
            -PXSTREAMING_RELEASE_STORE_FILE=debug.keystore \
            -PXSTREAMING_RELEASE_STORE_PASSWORD=android \
            -PXSTREAMING_RELEASE_KEY_ALIAS=androiddebugkey \
            -PXSTREAMING_RELEASE_KEY_PASSWORD=android

      - uses: actions/upload-artifact@v4
        with:
          name: xstreaming-live-apk
          path: android/app/build/outputs/apk/live/release/*.apk
